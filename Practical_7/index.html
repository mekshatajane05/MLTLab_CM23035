<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Edge Deployment</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>
:root {
    --bg-dark: #0f172a;
    --bg-lighter: #1e293b;
    --primary: #22c55e;
    --secondary: #06b6d4;
    --accent: #f59e0b;
    --text-light: #f1f5f9;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
    --surface: rgba(30, 41, 59, 0.6);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Outfit',sans-serif;
    background:#020617;
    color:var(--text-light);
}

/* Glow */
.glow-1 {
    position:fixed;
    top:-20%; left:-10%;
    width:70vw; height:70vw;
    background:radial-gradient(circle, rgba(34,197,94,0.2), transparent 70%);
    border-radius:50%;
}

.glow-2 {
    position:fixed;
    bottom:-20%; right:-10%;
    width:60vw; height:60vw;
    background:radial-gradient(circle, rgba(6,182,212,0.2), transparent 70%);
    border-radius:50%;
}

/* Header */
header { text-align:center; margin:40px 0; }

h1 {
    font-size:3rem;
    background:linear-gradient(to right,#22c55e,#06b6d4);
    -webkit-back-ground-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle { color:var(--text-muted); }

/* Layout */
main {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
}

/* Panels */
.glass-panel {
    background:rgba(30,41,59,0.6);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(15px);
    border:1px solid var(--border);
}

/* Buttons */
button {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:600;
}

.btn { background:#1e293b; color:white; }

.btn-primary {
    background:linear-gradient(135deg,#22c55e,#06b6d4);
}

.btn-success {
    background:linear-gradient(135deg,#059669,#10b981);
}

/* Image */
.image-container {
    width:100%;
    height:250px;
    overflow:hidden;
    border-radius:10px;
}

#test-image {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Logs */
.log-box {
    background:#020617;
    padding:10px;
    height:150px;
    overflow:auto;
    border-radius:10px;
    font-family:monospace;
    font-size:12px;
}

</style>
</head>

<body>

<div class="glow-1"></div>
<div class="glow-2"></div>

<header>
<h1>Model Edge Deployment</h1>
<p class="subtitle">Run MobileNet directly in browser</p>
</header>

<main>

<div class="glass-panel">
<h2>⚙️ Model Operations</h2>

<button class="btn" onclick="loadFromCDN()">Load Model</button>
<button class="btn" onclick="saveToLocal()">Save Model</button>
<button class="btn" onclick="reloadFromLocal()">Reload Model</button>

</div>

<div class="glass-panel">

<h2>👁️ Prediction</h2>

<div class="image-container">
<imgid="test-image" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=800" crossorigin="anonymous">
</div>

<inputtype="file" onchange="handleImageUpload(event)">

<button class="btn-primary" onclick="runPrediction()">Predict</button>

<div class="log-box" id="log-box"></div>

</div>

</main>

<script>
let model;

function log(msg){
    document.getElementById("log-box").innerHTML += msg+"<br>";
}

async function loadFromCDN(){
    model = await tf.loadLayersModel(
    'https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/model.json'
    );
    log("Model Loaded");
}

async function saveToLocal(){
    await model.save('indexeddb://model');
    log("Saved");
}

async function reloadFromLocal(){
    model = await tf.loadLayersModel('indexeddb://model');
    log("Reloaded");
}

async function runPrediction(){
    const img = document.getElementById('test-image');
    const tensor = tf.browser.fromPixels(img)
        .resizeNearestNeighbor([224,224])
        .toFloat()
        .expandDims();

    const pred = model.predict(tensor);
    log("Prediction done");
}

function handleImageUpload(e){
    const reader = new FileReader();
    reader.onload = function(ev){
        document.getElementById("test-image").src = ev.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}
</script>

</body>
</html>
