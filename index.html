<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLT Practicals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      color: #1a1a18;
    }

    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #185fa5;
      background: #e6f1fb;
      border-radius: 8px;
      padding: 4px 14px;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: #1a1a18;
      margin-bottom: 0.4rem;
    }

    .hero p {
      font-size: 14px;
      color: #888780;
    }

    .divider {
      height: 0.5px;
      background: rgba(0,0,0,0.12);
      margin-bottom: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 1.1rem 1rem 1rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: rgba(0,0,0,0.25);
      background: #faf9f6;
    }

    .card-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
    }

    .card.prelab .card-accent  { background: #5DCAA5; }
    .card.p1 .card-accent      { background: #378ADD; }
    .card.p2 .card-accent      { background: #7F77DD; }
    .card.p3 .card-accent      { background: #D4537E; }
    .card.p4 .card-accent      { background: #EF9F27; }
    .card.p5 .card-accent      { background: #E24B4A; }
    .card.p6 .card-accent      { background: #639922; }
    .card.p7 .card-accent      { background: #D85A30; }
    .card.p8 .card-accent      { background: #534AB7; }
    .card.postlab .card-accent { background: #0F6E56; }

    .card-num {
      font-size: 11px;
      font-weight: 600;
      color: #b4b2a9;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .card-title {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a18;
      line-height: 1.3;
    }

    .card-arrow {
      font-size: 16px;
      color: #b4b2a9;
      align-self: flex-end;
      margin-top: auto;
      transition: color 0.15s;
    }

    .card:hover .card-arrow { color: #5f5e5a; }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 12px;
      color: #b4b2a9;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-tag">Lab Portal</div>
      <h1>MLT Practicals</h1>
      <p>Select a session to get started</p>
    </div>

    <div class="divider"></div>

    <div class="grid">
      <a class="card prelab" href="Prelab/index.html">
        <div class="card-accent"></div>
        <div class="card-num">Intro</div>
        <div class="card-title">Pre-Lab</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p1" href="Practical_1/index.html">
        <div class="card-accent"></div>
        <div class="card-num">01</div>
        <div class="card-title">Practical 1</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p2" href="Practical2/index.html">
        <div class="card-accent"></div>
        <div class="card-num">02</div>
        <div class="card-title">Practical 2</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p3" href="Practical3/index.html">
        <div class="card-accent"></div>
        <div class="card-num">03</div>
        <div class="card-title">Practical 3</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p4" href="Practical_4/index.html">
        <div class="card-accent"></div>
        <div class="card-num">04</div>
        <div class="card-title">Practical 4</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p5" href="Practical_5/index.html">
        <div class="card-accent"></div>
        <div class="card-num">05</div>
        <div class="card-title">Practical 5</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p6" href="Practical_6/index.html">
        <div class="card-accent"></div>
        <div class="card-num">06</div>
        <div class="card-title">Practical 6</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p7" href="Practical_7/index.html">
        <div class="card-accent"></div>
        <div class="card-num">07</div>
        <div class="card-title">Practical 7</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card p8" href="Practical_8/index.html">
        <div class="card-accent"></div>
        <div class="card-num">08</div>
        <div class="card-title">Practical 8</div>
        <div class="card-arrow">→</div>
      </a>
      <a class="card postlab" href="post_lab/index.html">
        <div class="card-accent"></div>
        <div class="card-num">Final</div>
        <div class="card-title">Post-Lab</div>
        <div class="card-arrow">→</div>
      </a>
    </div>

    <div class="footer">10 sessions · MLT Lab Portal</div>
  </div>
</body>
</html>
